<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <title>VOXY — Car Evolution</title>
  </head>
  <body>
    <main id="app">
      <section class="stage" aria-label="VOXY の時間をたどる体験">
        <div class="grain"></div>
        <div class="halo"></div>
        <p class="brand">CAR EVOLUTION</p>
        <div class="car-wrap" aria-hidden="true">
          <div class="car" id="car">
            <div class="roof"></div><div class="windshield"></div><div class="side-window"></div>
            <div class="body"></div><div class="grille"></div><div class="light left"></div><div class="light right"></div>
            <div class="wheel rear"></div><div class="wheel front"></div>
          </div>
        </div>
        <div class="intro" id="intro"><h1>VOXY</h1><p>2001 — NOW</p></div>
        <div class="time" aria-live="polite"><span id="year"></span><span class="year-rule"></span></div>
        <div class="prompt" id="prompt"><i></i><span>時間を戻す</span></div>
        <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      </section>
      <div class="journey" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
