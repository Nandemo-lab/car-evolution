name: CarVista canonical redirects cutover
on:
  push:
    branches: [preview/carvista-b5152ea]
    paths: [docs/carvista-redirect-cutover-request.txt]
permissions:
  contents: read
jobs:
  apply-reviewed-redirects:
    if: github.repository == 'Nandemo-lab/car-evolution' && github.ref == 'refs/heads/preview/carvista-b5152ea'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: carvista-zone-read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify OWNER-reviewed commit and execute scoped change
        env:
          CARVISTA_CF_REDIRECT_TOKEN: ${{ secrets.CARVISTA_CF_REDIRECT_TOKEN }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CARVISTA_CF_REDIRECT_TOKEN"
          node scripts/apply-carvista-redirects.mjs
