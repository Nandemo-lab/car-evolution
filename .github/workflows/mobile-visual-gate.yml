name: Mobile visual gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:cloudflare
      - name: Start isolated preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/carvista-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - run: node scripts/mobile-visual-gate.mjs
      - name: Check deployed isolated Cloudflare pages
        run: MOBILE_QA_ORIGIN=https://carvista-static-preview.nandemomail24.workers.dev MOBILE_QA_PATHS=/cars/noah.html,/cars/voxy.html,/cars/tanto.html MOBILE_QA_OUTPUT_DIR=mobile-cloudflare-evidence node scripts/mobile-visual-gate.mjs
      - name: Check approved production routes and ad placement
        run: MOBILE_QA_ORIGIN=https://carvista.jp MOBILE_QA_PATHS=/cars/noah.html,/noah-80-vs-90.html,/cars/prius.html,/cars/freed.html,/cars/spacia.html MOBILE_QA_OUTPUT_DIR=mobile-production-evidence node scripts/mobile-visual-gate.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mobile-evidence
          path: |
            mobile-evidence/
            mobile-cloudflare-evidence/
            mobile-production-evidence/
          retention-days: 7
